# On a v* tag: builds the Windows desktop app and the Linux server binary,
# then publishes them as a GitHub release.
#   git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest  # the desktop package only builds on Windows
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.Version=$VERSION" \
            -o dist/rltracker.exe .
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o dist/rltracker-server-linux-amd64 ./cmd/rltracker-server

      - uses: softprops/action-gh-release@v2
        with:
          name: Rocket Tracker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/rltracker.exe
            dist/rltracker-server-linux-amd64
