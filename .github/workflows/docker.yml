# Builds the server image (Dockerfile) and pushes it to the homelab Harbor.
# Repository secrets: HARBOR_USERNAME / HARBOR_PASSWORD (a Harbor robot account
# with push rights on the my-apps project).
name: Docker image

on:
  push:
    branches: [main, self-hosted]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: harbor.virgilebaisnee.fr
  IMAGE: harbor.virgilebaisnee.fr/my-apps/rocket-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
